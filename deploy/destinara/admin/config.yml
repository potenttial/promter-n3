# Panel de publicación de Destinara
backend:
  name: git-gateway
  repo: potenttial/portales-web
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/c68a75c0-9f70-4f58-9fac-6bb8f151d059/pkce
  auth_token_endpoint: /sites/c68a75c0-9f70-4f58-9fac-6bb8f151d059/token
  gateway_url: https://gateway.decapbridge.com
site_url: https://www.destinara.net
display_url: https://www.destinara.net
media_folder: sites/destinara/public/img/uploads
public_folder: /img/uploads
locale: es
slug: { encoding: ascii, clean_accents: true }
collections:
  - name: es
    label: Artículos (Español)
    folder: sites/destinara/src/content/articulos/es
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Título", name: title, widget: string }
      - { label: "Resumen (para Google y las IAs)", name: description, widget: text }
      - { label: "Fecha y hora de publicación", name: date, widget: datetime }
      - { label: "Idioma", name: lang, widget: hidden, default: es }
      - { label: "Clave de traducción (igual en ES y EN)", name: key, widget: string }
      - label: "Sección"
        name: category
        widget: select
        options:
          - { label: "Aerolíneas", value: aerolineas }
          - { label: "Hotelería", value: hoteleria }
          - { label: "Agencias y OTAs", value: agencias }
          - { label: "Destinos", value: destinos }
          - { label: "Cruceros", value: cruceros }
          - { label: "Indicadores", value: indicadores }
          - { label: "Pagos y fintech", value: pagos }
          - { label: "Seguros y asistencia", value: seguros }
          - { label: "F&B en hotelería", value: fb }
          - { label: "Retail y duty free", value: retail }
          - { label: "Conectividad", value: conectividad }
          - { label: "Wellness y spa", value: wellness }
          - { label: "Capacitación", value: talento }
          - { label: "Movilidad y renta de autos", value: movilidad }
          - { label: "Lujo y estilo de vida", value: lujo }
          - { label: "MICE y congresos", value: mice }
          - { label: "Tecnología e IA", value: tecnologia }
      - { label: "Autor", name: author, widget: string }
      - { label: "Imagen principal", name: image, widget: image, required: false }
      - { label: "Texto alternativo de la imagen", name: imageAlt, widget: string, required: false }
      - { label: "Crédito de la foto (ej. Foto: Autor · CC BY 3.0 · Wikimedia Commons)", name: imageCredit, widget: string, required: false }
      - label: "Fuente"
        name: source
        widget: object
        required: false
        fields:
          - { label: "Nombre del medio", name: name, widget: string, required: false }
          - { label: URL, name: url, widget: string, required: false }
      - { label: "Historia de portada", name: featured, widget: boolean, default: false }
      - { label: "Borrador", name: draft, widget: boolean, default: false }
      - label: "Preguntas frecuentes (GEO)"
        name: faq
        widget: list
        required: false
        fields: [{ label: "Pregunta", name: q, widget: string }, { label: "Respuesta", name: a, widget: text }]
      - { label: "Texto", name: body, widget: markdown }
  - name: en
    label: Articles (English)
    folder: sites/destinara/src/content/articulos/en
    create: true
    slug: "{{slug}}"
    sortable_fields: [date, title]
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Summary (for Google and AI)", name: description, widget: text }
      - { label: "Publish date and time", name: date, widget: datetime }
      - { label: "Language", name: lang, widget: hidden, default: en }
      - { label: "Translation key (same in ES and EN)", name: key, widget: string }
      - label: "Section"
        name: category
        widget: select
        options:
          - { label: "Airlines", value: aerolineas }
          - { label: "Hospitality", value: hoteleria }
          - { label: "Agencies & OTAs", value: agencias }
          - { label: "Destinations", value: destinos }
          - { label: "Cruises", value: cruceros }
          - { label: "Indicators", value: indicadores }
          - { label: "Payments & fintech", value: pagos }
          - { label: "Insurance & assistance", value: seguros }
          - { label: "Hotel F&B", value: fb }
          - { label: "Retail & duty free", value: retail }
          - { label: "Connectivity", value: conectividad }
          - { label: "Wellness & spa", value: wellness }
          - { label: "Training & talent", value: talento }
          - { label: "Mobility & car rental", value: movilidad }
          - { label: "Luxury & lifestyle", value: lujo }
          - { label: "MICE & conventions", value: mice }
          - { label: "Technology & AI", value: tecnologia }
      - { label: "Author", name: author, widget: string }
      - { label: "Main image", name: image, widget: image, required: false }
      - { label: "Image alt text", name: imageAlt, widget: string, required: false }
      - { label: "Photo credit (e.g. Photo: Author · CC BY 3.0 · Wikimedia Commons)", name: imageCredit, widget: string, required: false }
      - label: "Source"
        name: source
        widget: object
        required: false
        fields:
          - { label: "Outlet name", name: name, widget: string, required: false }
          - { label: URL, name: url, widget: string, required: false }
      - { label: "Cover story", name: featured, widget: boolean, default: false }
      - { label: "Draft", name: draft, widget: boolean, default: false }
      - label: "FAQ (GEO)"
        name: faq
        widget: list
        required: false
        fields: [{ label: "Question", name: q, widget: string }, { label: "Answer", name: a, widget: text }]
      - { label: "Body", name: body, widget: markdown }
