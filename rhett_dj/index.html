body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: club-flyer hero (giant condensed name + framed portrait), then a lab console, then catalog grids. Single dark world, deliberate. */
:root{
  --ink:#0F0B12; --surface:#18121D; --surface-2:#211929; --line:#33283C;
  --fg:#F1E9DE; --muted:#A99CAD; --amber:#FFB547; --cyan:#5FD3E0;
  --rose:#F27BA8; --violet:#B9A6FF; --ember:#FF6B4A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:.92;letter-spacing:.005em}
h2{font-size:clamp(2.6rem,6vw,4.6rem);font-weight:900;text-transform:uppercase}
.eyebrow{font-family:var(--mono);font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
.lede{color:var(--muted);max-width:62ch;font-size:1.06rem}
section{padding-block:clamp(64px,9vw,112px)}
.sec-head{display:grid;gap:14px;margin-bottom:40px}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}

/* nav */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--ink) 86%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:12px}
.mark{font-family:var(--display);font-weight:900;font-size:1.5rem;letter-spacing:.04em;text-decoration:none;text-transform:uppercase}
.mark b{color:var(--amber)}
nav.links{display:flex;gap:22px;margin-left:auto;font-size:.9rem;color:var(--muted)}
nav.links a{text-decoration:none}
nav.links a:hover{color:var(--fg)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);font:500 .78rem var(--mono);padding:7px 11px;cursor:pointer;letter-spacing:.08em}
.lang button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
@media (max-width:820px){nav.links{display:none}.lang{margin-left:auto}}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;font:600 .95rem var(--body);text-decoration:none;padding:14px 22px;border-radius:999px;border:1px solid var(--line);color:var(--fg);background:transparent;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:var(--surface-2)}
.btn.wa{background:var(--amber);color:#1B1206;border-color:var(--amber)}
.btn.wa:hover{background:#FFC46B}
.btn svg{width:18px;height:18px;flex:none}

/* hero */
.hero{padding-block:clamp(36px,6vw,72px) clamp(48px,7vw,88px);position:relative;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:1.25fr .9fr;gap:clamp(24px,4vw,56px);align-items:end}
.hero h1{font-size:clamp(6rem,22vw,16rem);font-weight:900;text-transform:uppercase;line-height:.82}
.hero h1 span{display:block}
.realname{font:500 clamp(1.1rem,2.4vw,1.5rem) var(--mono);letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin:14px 0 0}
.hero h1 .o{-webkit-text-stroke:2px var(--fg);color:transparent}
.hero .tag{margin-top:22px;font-size:clamp(1.1rem,2vw,1.35rem);max-width:34ch;line-height:1.45}
.hero .tag strong{color:var(--amber);font-weight:600}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.portrait{position:relative;max-width:100%;aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--surface)}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(.35) contrast(1.06);display:block}
.portrait::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(15,11,18,.85));pointer-events:none}
.portrait canvas{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen;pointer-events:none}
.readout{position:absolute;left:14px;right:14px;bottom:12px;z-index:2;display:flex;justify-content:space-between;font:500 .74rem var(--mono);letter-spacing:.08em;color:var(--fg)}
.readout em{font-style:normal;color:var(--cyan)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:clamp(36px,5vw,56px)}
.facts div{background:var(--ink);padding:18px 20px}
.facts b{display:block;font:900 2.2rem/1 var(--display);color:var(--fg)}
.facts span{font-size:.84rem;color:var(--muted)}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}.portrait{max-width:420px;aspect-ratio:1/1}}
@media (max-width:520px){.facts{grid-template-columns:1fr}}

/* lab */
.lab{background:var(--surface);border-block:1px solid var(--line)}
.console{display:grid;grid-template-columns:1fr 330px;gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--ink)}
.stage{position:relative;min-width:0}
#brain{display:block;width:100%;height:auto;aspect-ratio:16/11}
.phases{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.phase{font:500 .82rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--ink);color:var(--muted);cursor:pointer}
.phase[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.panel{border-left:1px solid var(--line);padding:22px;display:grid;gap:18px;align-content:start;min-width:0}
.meter-top{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.meter-top div{border:1px solid var(--line);border-radius:4px;padding:10px 12px}
.meter-top small{display:block;font:500 .68rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meter-top b{font:700 1.9rem/1.1 var(--display);font-variant-numeric:tabular-nums}
.meter-top i{font-style:normal;font-size:.8rem;color:var(--cyan);font-family:var(--mono)}
.nt{display:grid;gap:9px}
.nt-row{display:grid;grid-template-columns:110px 1fr 34px;gap:10px;align-items:center;font-size:.85rem}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.nt-row span:last-child{font:500 .75rem var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.circuits{font-size:.86rem;color:var(--muted)}
.circuits b{color:var(--fg);font-weight:600}
.phase-desc{font-size:.95rem;line-height:1.55}
.listen{justify-self:start}
.note{font-size:.76rem;color:var(--muted);margin-top:14px}
@media (max-width:900px){.console{grid-template-columns:1fr}.panel{border-left:0;border-top:1px solid var(--line)}}

/* method */
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(20px,3vw,40px)}
.pillar{border-top:2px solid var(--fg);padding-top:18px;display:grid;gap:10px;align-content:start}
.pillar .unit{font:500 .78rem var(--mono);color:var(--cyan);letter-spacing:.08em}
.pillar h3{font-size:2rem;text-transform:uppercase;font-weight:700}
.pillar p{margin:0;color:var(--muted)}
@media (max-width:820px){.pillars{grid-template-columns:1fr}}

/* discography */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
.disco{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:24px 20px}
.rel{display:grid;gap:10px;align-content:start}
.cover{aspect-ratio:1/1;max-width:100%;border-radius:3px;position:relative;overflow:hidden;background:var(--surface)}
.cover canvas{width:100%;height:100%;display:block}
.cover .bpm{position:absolute;left:10px;top:10px;font:500 .68rem var(--mono);letter-spacing:.1em;background:rgba(15,11,18,.7);padding:4px 7px;border-radius:2px}
.rel h3{font-size:1.45rem;font-weight:700;text-transform:uppercase;line-height:1}
.rel .meta{display:flex;justify-content:space-between;gap:8px;font:500 .74rem var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rel p{margin:0;font-size:.86rem;color:var(--muted)}

/* films */
.films{border-top:1px solid var(--line)}
.film{display:grid;grid-template-columns:70px 1.4fr 1fr 1.3fr;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:baseline}
.film .yr{font:500 .9rem var(--mono);color:var(--amber);font-variant-numeric:tabular-nums}
.film h3{font-size:1.9rem;font-weight:700;text-transform:uppercase;line-height:1}
.film .kind{font:500 .75rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.film .role{font-size:.92rem}
.film .role small{display:block;color:var(--muted);font-size:.82rem}
@media (max-width:760px){.film{grid-template-columns:56px 1fr;row-gap:6px}.film .kind,.film .role{grid-column:2}}

/* faq */
.faq{display:grid;gap:0;border-top:1px solid var(--line);max-width:860px}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--amber)}
.faq details[open] summary::after{content:"–"}
.faq p{margin:10px 0 0;color:var(--muted);max-width:68ch}

/* contact */
.contact{background:var(--amber);color:#1B1206}
.contact .wrap{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:end}
.contact h2{font-size:clamp(3rem,8vw,6.4rem)}
.contact p{max-width:44ch;font-size:1.08rem}
.num{font:700 clamp(1.8rem,4vw,2.6rem)/1 var(--display);letter-spacing:.02em;user-select:all}
.contact .btn{border-color:#1B1206;color:#1B1206}
.contact .btn.dark{background:#1B1206;color:var(--amber)}
.contact .btn:hover{background:rgba(27,18,6,.1)}
.contact .btn.dark:hover{background:#2c1e0b}
.contact .box{display:grid;gap:14px;justify-items:start}
.copied{font:500 .78rem var(--mono);min-height:1.2em}
@media (max-width:820px){.contact .wrap{grid-template-columns:1fr}}
footer{padding-block:28px;color:var(--muted);font-size:.82rem}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}

.fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:var(--amber);color:#1B1206;display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.fab svg{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

</head>

let lang="es",phase=2,filter="all";
try{const s=localStorage.getItem("vf-lang");if(s&&T[s])lang=s}catch(e){}

function waLink(){return "https://wa.me/525564877257?text="+encodeURIComponent(T[lang].wa)}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=T[lang][el.dataset.i18n]});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=T[lang][el.dataset.i18nHtml]});
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.querySelectorAll(".js-wa").forEach(a=>a.href=waLink());
  renderPhases();renderFilters();renderDisco();renderFilms();renderFaq();setPhase(phase,true);
  document.querySelector("#listen span").textContent=audio?T[lang].stop:T[lang].listen;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("vf-lang",lang)}catch(e){}applyLang()});

function renderPhases(){
  const w=document.getElementById("phases");w.innerHTML="";
  PH.forEach((p,i)=>{const b=document.createElement("button");b.className="phase";b.type="button";b.id="ph-"+p.k;
    b.textContent=p.t[lang];b.setAttribute("aria-pressed",i===phase);b.onclick=()=>setPhase(i);w.appendChild(b)});
}
function setPhase(i,silent){
  phase=i;const p=PH[i];
  document.querySelectorAll(".phase").forEach((b,j)=>b.setAttribute("aria-pressed",j===i));
  document.getElementById("m-bpm").textContent=p.bpm;
  document.getElementById("m-hz").textContent=p.hz;
  document.getElementById("m-band").textContent="Hz · "+p.band;
  document.getElementById("ro-bpm").textContent=p.bpm;
  document.getElementById("ro-band").textContent=p.band+" "+p.hz+" Hz";
  document.getElementById("m-desc").textContent=p.d[lang];
  const nt=document.getElementById("nt");
  if(!nt.children.length){NT.forEach(n=>{nt.insertAdjacentHTML("beforeend",`<div class="nt-row"><span></span><div class="bar"><i style="width:0;background:${n.c}"></i></div><span></span></div>`)})}
  NT.forEach((n,j)=>{const r=nt.children[j];r.children[0].textContent=n.n[lang];r.querySelector("i").style.width=p.nt[j]+"%";r.children[2].textContent=p.nt[j]});
  const lbl={es:"Circuitos activos",pt:"Circuitos ativos",en:"Active circuits"}[lang];
  document.getElementById("m-circ").innerHTML=`<b>${lbl}:</b> `+p.act.map(a=>REG[a].n[lang]).join(" · ");
  if(audio&&!silent)startAudio();
}
function renderFilters(){
  const w=document.getElementById("filters");w.innerHTML="";
  ["all","album","ep","single","remix"].forEach(k=>{const b=document.createElement("button");b.className="phase";b.type="button";b.id="flt-"+k;
    const c=k==="all"?DISCO.length:DISCO.filter(d=>d.ty===k).length;
    b.textContent=T[lang][k]+" · "+c;b.setAttribute("aria-pressed",k===filter);b.onclick=()=>{filter=k;renderFilters();renderDisco()};w.appendChild(b)});
}
function renderDisco(){
  const w=document.getElementById("disco");w.innerHTML="";
  DISCO.filter(d=>filter==="all"||d.ty===filter).forEach(d=>{
    const el=document.createElement("article");el.className="rel";
    el.innerHTML=`<div class="cover"><canvas width="400" height="400"></canvas><span class="bpm">${d.bpm} BPM · ${d.b}</span></div>
      <div class="meta"><span>${T[lang][d.ty]}</span><span>${d.y}</span></div><h3></h3><p></p>`;
    el.querySelector("h3").textContent=d.t;el.querySelector("p").textContent=d.d[lang];
    w.appendChild(el);drawCover(el.querySelector("canvas"),d);
  });
}
function drawCover(c,d){
  const x=c.getContext("2d"),W=400,s=[...d.t].reduce((a,ch)=>a+ch.charCodeAt(0),0);
  const g=x.createLinearGradient(0,0,W,W);g.addColorStop(0,`hsl(${d.h} 55% 18%)`);g.addColorStop(1,`hsl(${(d.h+40)%360} 50% 8%)`);
  x.fillStyle=g;x.fillRect(0,0,W,W);
  const f={"α":10,"β":18,"γ":40,"θ":6}[d.b];
  x.lineWidth=1.6;
  for(let k=0;k<18;k++){x.beginPath();x.strokeStyle=`hsla(${(d.h+k*6)%360} 85% ${55+k}% / ${.12+k*.035})`;
    for(let i=0;i<=W;i+=4){const yy=W*.58+Math.sin(i/W*Math.PI*2*(f/6)+k*.35+s)*(14+k*3.2)*Math.sin(i/W*Math.PI)-k*9;i?x.lineTo(i,yy):x.moveTo(i,yy)}x.stroke()}
  x.fillStyle="rgba(241,233,222,.9)";x.font="700 34px 'Big Shoulders Display', Impact, sans-serif";x.textBaseline="bottom";
  x.fillText("RHETT",20,W-18);
}

  FAQ[lang].forEach(([q,a])=>{const d=document.createElement("details");d.innerHTML="<summary></summary><p></p>";d.querySelector("summary").textContent=q;d.querySelector("p").textContent=a;w.appendChild(d)});
}

/* brain animation */
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const cv=document.getElementById("brain"),cx=cv.getContext("2d");
let W=0,H=0,DPR=1,parts=[],t0=performance.now(),lvl=PH.map(()=>0);
function size(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",size);
const act={};Object.keys(REG).forEach(k=>act[k]=0);
function ntColor(k){return NT.find(n=>n.k===k).c}
function frame(now){
  const t=(now-t0)/1000,p=PH[phase];
  Object.keys(REG).forEach(k=>{act[k]+=((p.act.includes(k)?1:.12)-act[k])*.05});
  cx.clearRect(0,0,W,H);
  const bx=W*.06,by=H*.06,bw=W*.88,bh=H*.62;
  // brain silhouette
  cx.save();cx.strokeStyle="rgba(169,156,173,.28)";cx.lineWidth=1.2;
  cx.beginPath();cx.ellipse(bx+bw*.5,by+bh*.45,bw*.47,bh*.46,0,Math.PI*.98,Math.PI*2.02);
  cx.bezierCurveTo(bx+bw*.98,by+bh*.75,bx+bw*.9,by+bh*.95,bx+bw*.72,by+bh*.86);
  cx.bezierCurveTo(bx+bw*.62,by+bh*1.02,bx+bw*.56,by+bh*.98,bx+bw*.55,by+bh*.86);
  cx.bezierCurveTo(bx+bw*.3,by+bh*.95,bx+bw*.04,by+bh*.8,bx+bw*.03,by+bh*.45);cx.stroke();
  // gyri hints
  for(let i=0;i<7;i++){cx.beginPath();const yy=by+bh*(.15+i*.1);cx.moveTo(bx+bw*.1,yy);
    for(let xx=0;xx<=1;xx+=.05)cx.lineTo(bx+bw*(.1+xx*.8),yy+Math.sin(xx*12+i)*bh*.025);cx.strokeStyle="rgba(169,156,173,.07)";cx.stroke()}
  cx.restore();
  const P=k=>({x:bx+REG[k].x*bw,y:by+REG[k].y*bh});
  // edges
  EDGES.forEach(([a,b])=>{const A=P(a),B=P(b),e=Math.min(act[a],act[b]);cx.strokeStyle=`rgba(241,233,222,${.06+e*.35})`;cx.lineWidth=.8+e*1.6;cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(B.x,B.y);cx.stroke()});
  // spawn particles on beat
  const beat=60/p.bpm;
  if(!RM&&Math.random()<.35){const live=EDGES.filter(([a,b])=>p.act.includes(a)||p.act.includes(b));const e=live[Math.random()*live.length|0];
    if(e){const fwd=Math.random()<.5;parts.push({a:fwd?e[0]:e[1],b:fwd?e[1]:e[0],u:0,sp:.006+Math.random()*.012*(p.bpm/110),c:ntColor(p.flow[Math.random()*p.flow.length|0])})}}
  parts=parts.filter(q=>q.u<1);
  parts.forEach(q=>{q.u+=q.sp;const A=P(q.a),B=P(q.b),x=A.x+(B.x-A.x)*q.u,y=A.y+(B.y-A.y)*q.u;cx.fillStyle=q.c;cx.shadowColor=q.c;cx.shadowBlur=10;cx.beginPath();cx.arc(x,y,2.3,0,7);cx.fill()});
  cx.shadowBlur=0;
  // nodes
  const pulse=RM?0:Math.pow(Math.max(0,Math.cos((t%beat)/beat*Math.PI)),6);
  const small=W<520;
  Object.keys(REG).forEach(k=>{const {x,y}=P(k),a=act[k],r=4+a*7+a*pulse*5;
    cx.fillStyle=`rgba(255,181,71,${.12*a})`;cx.beginPath();cx.arc(x,y,r*2.6,0,7);cx.fill();
    cx.fillStyle=a>.5?"#FFB547":"#5A4B63";cx.beginPath();cx.arc(x,y,r,0,7);cx.fill();
    cx.fillStyle=`rgba(241,233,222,${.35+a*.6})`;cx.font=`500 ${small?9:11}px "IBM Plex Mono", monospace`;
    cx.fillText(small?k:REG[k].n[lang],x+r+5,y+4)});
  // oscilloscope
  const oy=H*.86,oh=H*.09;
  cx.strokeStyle="rgba(169,156,173,.25)";cx.lineWidth=1;cx.beginPath();cx.moveTo(bx,oy);cx.lineTo(bx+bw,oy);cx.stroke();
  cx.lineWidth=2;cx.strokeStyle="#5FD3E0";cx.beginPath();
  const cyc=p.hz/2.2;
  for(let i=0;i<=bw;i+=2){const u=i/bw;const env=.55+.45*pulse;
    const y=oy-Math.sin(u*Math.PI*2*cyc-(RM?0:t*3))*oh*env*Math.sin(u*Math.PI);i?cx.lineTo(bx+i,y):cx.moveTo(bx+i,y)}
  cx.stroke();
  cx.fillStyle="rgba(241,233,222,.75)";cx.font='500 11px "IBM Plex Mono", monospace';
  cx.fillText(`${p.band} ${p.hz} Hz  ·  ${p.bpm} BPM  ·  ${p.t[lang].toUpperCase()}`,bx,H*.97);
  cx.textAlign="right";cx.fillText("δ 0.5–4 · θ 4–8 · α 8–13 · β 13–30 · γ 30–100",bx+bw,H*.97);cx.textAlign="left";
  drawHalo(t,p,pulse);
  requestAnimationFrame(frame);
}
/* portrait halo */
const hc=document.getElementById("halo"),hx=hc.getContext("2d");
function drawHalo(t,p,pulse){
  const w=hc.clientWidth,h=hc.clientHeight;if(hc.width!==w*DPR){hc.width=w*DPR;hc.height=h*DPR}
  hx.setTransform(DPR,0,0,DPR,0,0);hx.clearRect(0,0,w,h);
  for(let k=0;k<4;k++){hx.beginPath();const R=Math.min(w,h)*(.32+k*.08)+pulse*6;
    for(let a=0;a<=Math.PI*2+.01;a+=.03){const rr=R+Math.sin(a*p.hz/2+t*(1.5+k*.4))*4;const x=w*.5+Math.cos(a)*rr,y=h*.42+Math.sin(a)*rr;a?hx.lineTo(x,y):hx.moveTo(x,y)}
    hx.strokeStyle=k%2?"rgba(95,211,224,.22)":"rgba(255,181,71,.25)";hx.lineWidth=1.2;hx.stroke()}
}

/* audio: kick at BPM + binaural pad (carrier / carrier+hz) */
let audio=null;
function stopAudio(){if(audio){audio.ctx.close();audio=null}document.querySelector("#listen span").textContent=T[lang].listen}
function startAudio(){
  if(audio)audio.ctx.close();
  const ctx=new (window.AudioContext||window.webkitAudioContext)(),p=PH[phase],out=ctx.createGain();out.gain.value=.5;out.connect(ctx.destination);
  const mk=(f,pan)=>{const o=ctx.createOscillator(),g=ctx.createGain(),s=ctx.createStereoPanner();o.frequency.value=f;g.gain.value=.06;s.pan.value=pan;o.connect(g).connect(s).connect(out);o.start()};
  mk(p.carrier,-1);mk(p.carrier+p.hz,1);
  const beat=60/p.bpm;let next=ctx.currentTime+.05;
  const tick=()=>{while(next<ctx.currentTime+.2){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(140,next);o.frequency.exponentialRampToValueAtTime(42,next+.12);
      g.gain.setValueAtTime(.7,next);g.gain.exponentialRampToValueAtTime(.001,next+.3);o.connect(g).connect(out);o.start(next);o.stop(next+.32);next+=beat}};
  const iv=setInterval(tick,50);tick();
  audio={ctx,iv};ctx.onstatechange=()=>{if(ctx.state==="closed")clearInterval(iv)};
  document.querySelector("#listen span").textContent=T[lang].stop;
}
document.getElementById("listen").onclick=()=>audio?stopAudio():startAudio();

applyLang();size();requestAnimationFrame(frame);
</script>
